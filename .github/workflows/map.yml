# The map, rebuilt every week from OpenStreetMap and published to
# map.pretzel.yairp.me (GitHub Pages). Also on a push to main, and by hand
# (Actions → Map → Run workflow).
name: Map
on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC; Geofabrik rebuilds its extract daily
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - name: Download the extract
        # Geofabrik first; OpenStreetMap France's copy if it doesn't answer.
        run: |
          for url in https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf \
                     https://download.openstreetmap.fr/extracts/asia/israel.osm.pbf; do
            if curl -fsSL --retry 3 -A 'pretzel-map (contact@yairp.me)' -o israel.osm.pbf "$url"; then echo "MAP_SOURCE=$url" >> "$GITHUB_ENV"; echo "from $url"; break; fi
          done
          test -s israel.osm.pbf
          ls -l israel.osm.pbf
      # Heights for climbs (heights.py, HEIGHTS.md): Copernicus GLO-30's 1° tiles over Israel, from AWS's open data.
      # They don't change, so they are kept in the job's cache, not fetched every week.
      - uses: actions/cache@v4
        with:
          path: dem
          key: copernicus-glo30-israel-v1
      - name: Height tiles (once; kept in the cache)
        run: |
          mkdir -p dem
          for lat in 29 30 31 32 33; do for lon in 034 035; do
            f=dem/N${lat}E${lon}.tif
            [ -s "$f" ] && continue
            curl -fsSL --retry 3 -A 'pretzel-map (contact@yairp.me)' -o "$f" \
              "https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N${lat}_00_E${lon}_00_DEM/Copernicus_DSM_COG_10_N${lat}_00_E${lon}_00_DEM.tif" || rm -f "$f"
          done; done
          ls -l dem
          test "$(ls dem/*.tif | wc -l)" -ge 8
      - run: python build.py israel.osm.pbf site dem
      - run: python check.py site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
