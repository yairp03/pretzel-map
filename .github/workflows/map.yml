# The map, rebuilt every week from OpenStreetMap and published to
# map.pretzel.yairp.me (GitHub Pages). Also on a push to main, and by hand
# (Actions → Map → Run workflow).
name: Map
on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC; Geofabrik rebuilds its extract daily
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - name: Download the extract
        # Geofabrik first; OpenStreetMap France's copy if it doesn't answer.
        run: |
          for url in https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf \
                     https://download.openstreetmap.fr/extracts/asia/israel.osm.pbf; do
            if curl -fsSL --retry 3 -A 'pretzel-map (contact@yairp.me)' -o israel.osm.pbf "$url"; then echo "MAP_SOURCE=$url" >> "$GITHUB_ENV"; echo "from $url"; break; fi
          done
          test -s israel.osm.pbf
          ls -l israel.osm.pbf
      - run: python build.py israel.osm.pbf site
      - run: python check.py site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
